# ============================================================
# MULTISET SDK CONFIGURATION
# ============================================================
# Get your credentials at: https://developer.multiset.ai/credentials
#
# Instructions:
# 1. Replace the placeholder values below with your actual credentials
# 2. Provide either MAP_CODE or MAP_SET_CODE (only one is required)
# 3. For Object Tracking provide a comma-separated list of object codes (max 10)
# 4. Sync your project after making changes
# ============================================================

# API Host (Optional) - leave empty for production: https://api.multiset.ai
MULTISET_BASE_URL=

# Authentication Credentials (Required)
MULTISET_CLIENT_ID=
MULTISET_CLIENT_SECRET=

# Map Configuration (Provide one of the following)
MULTISET_MAP_CODE=
MULTISET_MAP_SET_CODE=

# Object Tracking Configuration (comma-separated object codes, max 10)
# example OBJ_001, OBJ_002 ...
MULTISET_OBJECT_CODES=
